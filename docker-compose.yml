services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    build:
      context: ./wordpress
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_URL: http://localhost:8080
      WORDPRESS_ADMIN_USER: admin
      WORDPRESS_ADMIN_PASSWORD: admin123
      WORDPRESS_ADMIN_EMAIL: admin@example.com
      WORDPRESS_TITLE: iLife Store
      WORDPRESS_WEBHOOK_SECRET: dev-secret-change-me
      NEXTJS_URL: http://localhost:3000
    ports:
      - "8080:80"
    volumes:
      - wp_data:/var/www/html

  nextjs:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm dev"
    depends_on:
      - wordpress
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORDPRESS_URL: http://host.docker.internal:8080
      WORDPRESS_HOSTNAME: host.docker.internal
      NEXT_PUBLIC_WORDPRESS_URL: http://localhost:8080
      WORDPRESS_WEBHOOK_SECRET: dev-secret-change-me
      WC_CONSUMER_KEY: ${WC_CONSUMER_KEY:-ck_replace_me}
      WC_CONSUMER_SECRET: ${WC_CONSUMER_SECRET:-cs_replace_me}
    ports:
      - "3000:3000"
    volumes:
      - .:/app

volumes:
  db_data:
  wp_data:
