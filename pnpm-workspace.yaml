# pnpm v10.26+ / v11: allow build scripts for required native modules
# Replaces the deprecated "onlyBuiltDependencies" setting
allowBuilds:
  sharp: true
  unrs-resolver: true

# CUSTOM: pnpm v11 reads non-auth settings from THIS file (only auth/registry come from .npmrc).
# pnpm's default "isolated" (symlinked) node_modules breaks Next.js `output: "standalone"`:
# transitive @swc/helpers is traced only inside .pnpm/, so it never reaches the standalone
# bundle root, while Turbopack's server runtime requires it as a BARE specifier from the
# `.next/server/chunks` context -> "Cannot find module '@swc/helpers/_/_interop_require_default'"
# -> HTTP 500 on every request (ilife.co.id incident, Sep 2026).
# A hoisted (flat, npm-like) node_modules makes the tracer record root-level paths.
nodeLinker: hoisted

overrides:
  picomatch@^2: ">=2.3.2"
  picomatch@^4: ">=4.0.4"
  flatted: ">=3.4.2"
  minimatch@^3: ">=3.1.4"
  minimatch@^9: ">=9.0.7"
  brace-expansion@^1: ">=1.1.13"
  brace-expansion@^2: ">=2.0.3"
  js-yaml: ">=4.2.0"
  ajv: ">=6.14.0"
  # Path-based overrides for pinned transitive deps
  "next>postcss": ">=8.5.10"
  "micromatch>picomatch": ">=4.0.4"
  "@eslint/config-array>minimatch": ">=9.0.7"
  "eslint-plugin-import>minimatch": ">=9.0.7"
  "eslint-plugin-jsx-a11y>minimatch": ">=9.0.7"
  "eslint-plugin-react>minimatch": ">=9.0.7"
  "@eslint/eslintrc>minimatch": ">=9.0.7"
  "eslint>minimatch": ">=9.0.7"
